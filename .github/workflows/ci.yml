name: ci

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          - os: macos-latest
            cc: gcc   # gcc on mac is just clang anyway
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: build + test
        run: make test CC=${{ matrix.cc }}
      - name: sanitizers
        run: make asan CC=${{ matrix.cc }}
